syntax = "proto3";

package example.common;

// Общие типы для всех сервисов

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
  int32 total = 3;
}

message Timestamp {
  int64 seconds = 1;
  int32 nanos = 2;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}
